<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Quiz Champion - Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --gold: #ffd700;
            --gold-dark: #f7971e;
            --green: #2ecc71;
            --red: #e74c3c;
            --blue: #3498db;
            --purple: #9b59b6;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --radius: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(247, 151, 30, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(155, 89, 182, 0.05) 0%, transparent 50%);
            z-index: 0;
            animation: floatBg 20s ease-in-out infinite alternate;
        }

        @keyframes floatBg {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(2%, 2%) rotate(3deg);
            }
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
        }

        .app-container {
            background: var(--bg-secondary);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 32px 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-dark), var(--purple), transparent);
            opacity: 0.6;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-title {
            font-size: 26px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-title .icon {
            font-size: 30px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .app-title .text {
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .app-title .badge {
            font-size: 11px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            padding: 2px 12px;
            border-radius: 40px;
        }

        .header-stats {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .stat-badge:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .stat-badge i {
            color: var(--gold);
            font-size: 14px;
        }

        .stat-badge .value {
            color: #fff;
            font-weight: 800;
        }

        .stat-badge .value.gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-badge .timer-danger {
            color: var(--red);
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .progress-section {
            margin-bottom: 20px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--purple));
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-section {
            margin-bottom: 20px;
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 2px 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .category-scroll::-webkit-scrollbar {
            height: 3px;
        }

        .category-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        .cat-chip {
            flex-shrink: 0;
            padding: 6px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .cat-chip:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .cat-chip.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(247, 151, 30, 0.12));
            border-color: var(--gold);
            color: var(--gold);
        }

        .cat-chip i {
            font-size: 12px;
        }
        .cat-chip .count {
            font-size: 10px;
            opacity: 0.5;
        }

        .question-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 24px 22px;
            border: 1px solid var(--border-color);
            margin-bottom: 18px;
            transition: var(--transition);
        }

        .question-card:hover {
            border-color: var(--border-hover);
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .q-number {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-number i {
            color: var(--gold);
        }

        .q-category {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 40px;
            background: rgba(255, 215, 0, 0.08);
            color: var(--gold);
            border: 1px solid rgba(255, 215, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
            color: #fff;
            margin-bottom: 6px;
        }

        .q-difficulty {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .q-difficulty .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .q-difficulty .dot.easy {
            background: var(--green);
        }
        .q-difficulty .dot.medium {
            background: var(--gold);
        }
        .q-difficulty .dot.hard {
            background: var(--red);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0 14px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Inter', sans-serif;
            text-align: left;
        }

        .option-btn:hover:not(.disabled-option) {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .option-label {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            font-weight: 700;
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .option-btn.correct {
            border-color: var(--green);
            background: rgba(46, 204, 113, 0.08);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }

        .option-btn.correct .option-label {
            background: var(--green);
            color: #fff;
        }

        .option-btn.wrong {
            border-color: var(--red);
            background: rgba(231, 76, 60, 0.08);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        .option-btn.wrong .option-label {
            background: var(--red);
            color: #fff;
        }

        .option-btn.disabled-option {
            cursor: default;
            opacity: 0.5;
        }
        .option-btn.disabled-option:hover {
            transform: none;
            box-shadow: none;
        }

        .feedback-box {
            margin-top: 12px;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            min-height: 50px;
            transition: var(--transition);
        }

        .feedback-box i {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .feedback-box.correct {
            border-color: var(--green);
            background: rgba(46, 204, 113, 0.06);
            color: #8fdfb0;
        }

        .feedback-box.wrong {
            border-color: var(--red);
            background: rgba(231, 76, 60, 0.06);
            color: #f5a0a0;
        }

        .feedback-box.empty {
            color: var(--text-secondary);
        }
        .feedback-box .highlight {
            color: #fff;
            font-weight: 700;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .action-left,
        .action-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            padding: 10px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.12);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 215, 0, 0.2);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn i {
            font-size: 14px;
        }

        /* GAME */
        .game-container {
            text-align: center;
            padding: 20px 10px;
        }

        .game-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 0 auto 16px;
        }

        @media (max-width: 450px) {
            .game-grid {
                gap: 8px;
                max-width: 320px;
            }
        }

        .card-game {
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 900;
            color: var(--bg-primary);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
            user-select: none;
        }

        .card-game.flipped {
            background: var(--bg-card);
            border-color: var(--border-color);
            color: var(--text-primary);
            cursor: default;
        }

        .card-game.matched {
            background: rgba(46, 204, 113, 0.15);
            border-color: var(--green);
            cursor: default;
            opacity: 0.5;
        }

        .card-game:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.2);
        }

        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 12px 0 16px;
            flex-wrap: wrap;
        }

        .game-stat .number {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }
        .game-stat .label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .result-card {
            text-align: center;
            padding: 16px 10px 10px;
        }

        .result-emoji {
            font-size: 64px;
            margin-bottom: 4px;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: inline-block;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.1) rotate(3deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .result-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .result-score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: conic-gradient(var(--gold) var(--pct, 0%), var(--bg-card) var(--pct, 0%));
            position: relative;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.08);
        }

        .result-score-circle::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: var(--bg-secondary);
        }

        .result-score-circle .score-number {
            position: relative;
            z-index: 1;
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }

        .result-score-circle .score-label {
            position: relative;
            z-index: 1;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .result-details {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 14px 0 18px;
            flex-wrap: wrap;
        }

        .result-stat {
            text-align: center;
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            min-width: 80px;
        }

        .result-stat .number {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
        }
        .result-stat .number.green {
            color: var(--green);
        }
        .result-stat .number.red {
            color: var(--red);
        }
        .result-stat .number.gold {
            color: var(--gold);
        }
        .result-stat .label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .result-message {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 18px;
            padding: 14px 20px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
        }

        .result-message strong {
            color: var(--gold);
        }

        .achievement-section {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0 16px;
        }

        .achievement-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .achievement-badge.unlocked {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 215, 0, 0.06);
        }

        .achievement-badge i {
            font-size: 16px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 18px;
        }
        .toast .icon-success {
            color: var(--green);
        }
        .toast .icon-error {
            color: var(--red);
        }
        .toast .icon-info {
            color: var(--gold);
        }

        @media (max-width: 700px) {
            .app-container {
                padding: 18px 14px;
                border-radius: 18px;
            }
            .app-title {
                font-size: 20px;
            }
            .q-text {
                font-size: 17px;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 13px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }
            .stat-badge {
                font-size: 11px;
                padding: 4px 12px;
            }
            .result-score-circle {
                width: 110px;
                height: 110px;
            }
            .result-score-circle .score-number {
                font-size: 28px;
            }
            .game-grid {
                max-width: 280px;
                gap: 8px;
            }
            .card-game {
                font-size: 22px;
                border-radius: 10px;
            }
        }

        @media (max-width: 420px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-stats {
                justify-content: space-between;
            }
            .action-bar {
                flex-direction: column;
            }
            .action-left,
            .action-right {
                width: 100%;
                justify-content: center;
            }
            .btn {
                flex: 1;
                justify-content: center;
                font-size: 11px;
                padding: 8px 12px;
            }
            .game-grid {
                max-width: 220px;
                gap: 6px;
            }
            .card-game {
                font-size: 18px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle icon-success"></i>
        <span id="toastMessage">Selamat!</span>
    </div>

    <div class="app-wrapper">
        <div class="app-container" id="app">

            <div class="app-header">
                <div class="app-title">
                    <span class="icon">🏆</span>
                    <span class="text">Quiz Champion</span>
                    <span class="badge">v2.2</span>
                </div>
                <div class="header-stats">
                    <div class="stat-badge">
                        <i class="fas fa-star"></i> Skor: <span class="value gold" id="scoreDisplay">0</span>
                    </div>

                if (fill) {
                    const pct = (value / 15) * 100;
                    fill.style.width = pct + '%';
                    fill.style.background =
                        value <= 5 ?
                        'linear-gradient(90deg, #e74c3c, #c0392b)' :
                        value <= 10 ?
                        'linear-gradient(90deg, #f7971e, #ffd200)' :
                        'linear-gradient(90deg, #00d2ff, #3a7bd5)';
                }
                // Blink effect for timer text
                if (display) {
                    if (value <= 5) {
                        display.classList.add('timer-danger');
                    } else {
                        display.classList.remove('timer-danger');
                    }
                }
            }

            function handleTimeout() {
                if (answered) return;
                const options = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');
                if (options.length > 0 && feedback) {
                    options.forEach(btn => {
                        btn.classList.add('disabled-option');
                        if (btn.dataset.correct === 'true') {
                            btn.classList.add('correct');
                        }
                    });
                    const q = currentQuestions[currentIndex];
                    feedback.className = 'feedback-box wrong';
                    feedback.innerHTML =
                        `<i class="fas fa-clock"></i> ⏰ Waktu habis! Jawaban: <span class="highlight">${q.options[q.answer]}</span>`;
                    answered = true;
                    totalAnswered++;
                    streak = 0;
                    updateStreak();
                    const nextBtn = document.getElementById('nextBtn');
                    if (nextBtn) nextBtn.disabled = false;
                    checkAchievements();
                }
            }

            // ============================================================
            //  HELPERS
            // ============================================================
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function getQuestionsByCategory(category) {
                if (category === 'all') return shuffleArray([...allQuestions]);
                if (category === 'game') return [];
                const filtered = allQuestions.filter(q => q.category === category);
                return shuffleArray(filtered);
            }

            function updateScore() {
                scoreDisplay.textContent = score;
            }

            function updateStreak() {
                streakDisplay.textContent = streak;
            }

            function updateProgress() {
                const total = currentQuestions.length;
                const done = Math.min(currentIndex, total);
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                progressFill.style.width = Math.min(pct, 100) + '%';
                progressText.textContent = `Soal ${done} / ${total}`;
                progressPercent.textContent = pct + '%';
            }

            function showToast(message, type = 'success') {
                const icons = {
                    success: 'fas fa-check-circle icon-success',
                    error: 'fas fa-times-circle icon-error',
                    info: 'fas fa-info-circle icon-info'
                };
                const iconEl = toast.querySelector('i');
                if (iconEl) iconEl.className = icons[type] || icons.info;
                toastMessage.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            function checkAchievements() {
                const total = currentQuestions.length;
                if (!achievements.firstBlood && score > 0) {
                    achievements.firstBlood = true;
                    showToast('🏅 Achievement: First Blood!', 'info');
                }
                if (!achievements.streak5 && streak >= 5) {
                    achievements.streak5 = true;
                    showToast('🔥 Achievement: Streak 5!', 'info');
                }
                if (!achievements.streak10 && streak >= 10) {
                    achievements.streak10 = true;
                    showToast('⚡ Achievement: Streak 10!', 'info');
                }
                if (!achievements.perfectScore && score === total && total > 0) {
                    achievements.perfectScore = true;
                    showToast('💯 Achievement: Perfect Score!', 'info');
                }
                if (!achievements.master && score >= 50) {
                    achievements.master = true;
                    showToast('👑 Achievement: Master!', 'info');
                }
            }

            // ============================================================
            //  MINI GAME
            // ============================================================
            let gameCards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let gameMoves = 0;
            let isGameLocked = false;
            const gameEmojis = ['🚀', '🌟', '🎯', '💎', '🔥', '⚡', '🏆', '🎮'];

            function initGame() {
                isGameMode = true;
                stopTimer();

                const doubled = [...gameEmojis, ...gameEmojis];
                gameCards = shuffleArray(doubled);
                flippedCards = [];
                matchedPairs = 0;
                gameMoves = 0;
                isGameLocked = false;

                const html = `
                    <div class="game-container">
                        <div class="game-title">🎮 Memory Game</div>
                        <div class="game-subtitle">Cocokkan pasangan emoji yang sama!</div>
                        <div class="game-grid" id="gameGrid">
                            ${gameCards.map((emoji, idx) => `
                                <div class="card-game" data-index="${idx}" data-emoji="${emoji}">
                                    <span class="card-content">❓</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="game-stats">
                            <div class="game-stat">
                                <div class="number" id="gamePairs">0</div>
                                <div class="label">✅ Pasangan</div>
                            </div>
                            <div class="game-stat">
                                <div class="number" id="gameMoves">0</div>
                                <div class="label">🔄 Gerakan</div>
                            </div>
                        </div>
                        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px;">
                            <button class="btn btn-primary" id="gameResetBtn"><i class="fas fa-redo"></i> Ulang Game</button>
                            <button class="btn btn-secondary" id="gameBackBtn"><i class="fas fa-arrow-left"></i> Kembali</button>
                        </div>
                    </div>
                `;

                mainContent.innerHTML = html;
                updateScore();
                progressText.textContent = '🎮 Memory Game';
                progressPercent.textContent = '';
                progressFill.style.width = '100%';

                document.querySelectorAll('.card-game').forEach(card => {
                    card.addEventListener('click', () => handleCardClick(card));
                });

                document.getElementById('gameResetBtn').addEventListener('click', initGame);
                document.getElementById('gameBackBtn').addEventListener('click', () => {
                    isGameMode = false;
                    currentQuestions = getQuestionsByCategory(categoryFilter);
                    if (currentQuestions.length === 0) {
                        categoryFilter = 'all';
                        currentQuestions = getQuestionsByCategory('all');
                        document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                        document.querySelector('[data-category="all"]')?.classList.add('active');
                    }
                    currentIndex = 0;
                    score = 0;
                    correctCount = 0;
                    totalAnswered = 0;
                    streak = 0;
                    updateStreak();
                    renderQuestion();
                });

                document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                document.querySelector('[data-category="game"]')?.classList.add('active');
            }

            function handleCardClick(card) {
                if (isGameLocked) return;
                if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

                const emoji = card.dataset.emoji;
                card.querySelector('.card-content').textContent = emoji;
                card.classList.add('flipped');
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    gameMoves++;
                    document.getElementById('gameMoves').textContent = gameMoves;
                    isGameLocked = true;

                    const card1 = flippedCards[0];
                    const card2 = flippedCards[1];
                    const emoji1 = card1.dataset.emoji;
                    const emoji2 = card2.dataset.emoji;

                    if (emoji1 === emoji2 && card1 !== card2) {
                        card1.classList.add('matched');
                        card2.classList.add('matched');
                        matchedPairs++;
                        document.getElementById('gamePairs').textContent = matchedPairs;
                        flippedCards = [];
                        isGameLocked = false;
                        showToast('✅ Match!', 'success');

                        if (matchedPairs === gameEmojis.length) {
                            setTimeout(() => {
                                showToast('🎉 Selamat! Kamu menyelesaikan game! +5 poin!', 'info');
                                score += 5;
                                updateScore();
                                setTimeout(() => initGame(), 1500);
                            }, 300);
                        }
                    } else {
                        setTimeout(() => {
                            card1.querySelector('.card-content').textContent = '❓';
                            card1.classList.remove('flipped');
                            card2.querySelector('.card-content').textContent = '❓';
                            card2.classList.remove('flipped');
                            flippedCards = [];
                            isGameLocked = false;
                        }, 800);
                    }
                }
            }

            // ============================================================
            //  RENDER QUESTION
            // ============================================================
            function renderQuestion() {
                if (isGameMode) return;

                if (currentIndex >= currentQuestions.length) {
                    renderResult();
                    return;
                }

                const q = currentQuestions[currentIndex];
                const labels = ['A', 'B', 'C', 'D'];
                const diffMap = { 'Mudah': 'easy', 'Sedang': 'medium', 'Sulit': 'hard' };

                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button class="option-btn" data-index="${idx}" data-correct="${q.answer === idx ? 'true' : 'false'}">
                            <span class="option-label">${labels[idx]}</span>
                            ${opt}
                        </button>
                    `;
                });

                const html = `
                    <div class="question-card">
                        <div class="q-meta">
                            <span class="q-number">
                                <i class="fas fa-question-circle"></i> Soal ${currentIndex + 1} / ${currentQuestions.length}
                            </span>
                            <span class="q-category"><i class="fas fa-tag"></i> ${q.category}</span>
                        </div>
                        <div class="q-text">${q.question}</div>
                        <div class="q-difficulty">
                            <span class="dot ${diffMap[q.difficulty] || 'easy'}"></span>
                            ${q.difficulty || 'Mudah'}
                        </div>
                    </div>

                    <div class="options-grid" id="optionsGrid">
                        ${optionsHtml}
                    </div>

                    <div class="feedback-box empty" id="feedback">
                        <i class="fas fa-lightbulb"></i> Pilih jawaban atau biarkan timer berjalan.
                    </div>

                    <div class="action-bar">
                        <div class="action-left">
                            <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-redo"></i> Ulang</button>
                            <button class="btn btn-secondary" id="skipBtn"><i class="fas fa-forward"></i> Skip</button>
                        </div>
                        <div class="action-right">
                            <button class="btn btn-primary" id="nextBtn" disabled><i class="fas fa-arrow-right"></i> Selanjutnya</button>
                        </div>
                    </div>
                `;

                mainContent.innerHTML = html;
                answered = false;
                updateScore();
                updateProgress();
                updateStreak();

                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', onOptionClick);
                });

                document.getElementById('resetBtn').addEventListener('click', resetQuiz);
                document.getElementById('skipBtn').addEventListener('click', skipQuestion);
                document.getElementById('nextBtn').addEventListener('click', nextQuestion);

                startTimer();
            }

            // ============================================================
            //  OPTION CLICK
            // ============================================================
            function onOptionClick(e) {
                if (answered) return;
                const btn = e.currentTarget;
                const isCorrect = btn.dataset.correct === 'true';
                const allBtns = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');

                stopTimer();
                allBtns.forEach(b => b.classList.add('disabled-option'));

                if (isCorrect) {
                    btn.classList.add('correct');
                    score += 1;
                    correctCount++;
                    streak++;
                    maxStreak = Math.max(maxStreak, streak);
                    feedback.className = 'feedback-box correct';
                    feedback.innerHTML = `<i class="fas fa-check-circle"></i> ✅ Benar! +1 poin`;
                    showToast('✅ Jawaban Benar!', 'success');
                } else {
                    btn.classList.add('wrong');
                    streak = 0;
                    allBtns.forEach(b => {
                        if (b.dataset.correct === 'true') b.classList.add('correct');
                    });
                    const q = currentQuestions[currentIndex];
                    feedback.className = 'feedback-box wrong';
                    feedback.innerHTML =
                        `<i class="fas fa-times-circle"></i> ❌ Salah. Jawaban: <span class="highlight">${q.options[q.answer]}</span>`;
                    showToast('❌ Jawaban Salah', 'error');
                }

                updateScore();
                updateStreak();
                totalAnswered++;
                document.getElementById('nextBtn').disabled = false;
                answered = true;
                checkAchievements();
            }

            // ============================================================
            //  NAVIGATION
            // ============================================================
            function nextQuestion() {
                if (!answered) return;
                stopTimer();
                currentIndex++;
                renderQuestion();
            }

            function skipQuestion() {
                if (answered) return;
                stopTimer();
                const allBtns = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');
                allBtns.forEach(b => b.classList.add('disabled-option'));
                const q = currentQuestions[currentIndex];
                allBtns.forEach(b => {
                    if (b.dataset.correct === 'true') b.classList.add('correct');
                });
                feedback.className = 'feedback-box wrong';
                feedback.innerHTML =
                    `<i class="fas fa-forward"></i> ⏭️ Dilewati. Jawaban: <span class="highlight">${q.options[q.answer]}</span>`;
                answered = true;
                totalAnswered++;
                streak = 0;
                updateStreak();
                document.getElementById('nextBtn').disabled = false;
                showToast('⏭️ Soal dilewati', 'info');
            }

            // ============================================================
            //  RESULT
            // ============================================================
            function renderResult() {
                stopTimer();
                const total = currentQuestions.length;
                const wrongCount = totalAnswered - correctCount;
                const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

                let emoji, title, message;
                if (pct === 100) { emoji = '🏆';
                    title = 'Sempurna!';
                    message = 'Kamu menjawab <strong>semua soal dengan benar</strong>!'; } else if (pct >= 80) { emoji =
                        '🌟';
                    title = 'Luar Biasa!';
                    message = `Kamu mendapatkan <strong>${pct}%</strong> jawaban benar.`; } else if (pct >= 60) { emoji =
                        '💪';
                    title = 'Bagus!';
                    message = `Kamu menjawab <strong>${pct}%</strong> dengan benar.`; } else if (pct >= 40) { emoji =
                        '📖';
                    title = 'Semangat!';
                    message = `Kamu mencapai <strong>${pct}%</strong>. Belajar lebih giat!`; } else { emoji = '😅';
                    title = 'Coba Lagi!';
                    message = `Jangan menyerah! ${pct}% bukan akhir.`; }

                let achievementsHtml = '';
                const achList = [
                    { key: 'firstBlood', icon: '🩸', label: 'First Blood' },
                    { key: 'streak5', icon: '🔥', label: 'Streak 5' },
                    { key: 'streak10', icon: '⚡', label: 'Streak 10' },
                    { key: 'perfectScore', icon: '💯', label: 'Perfect Score' },
                    { key: 'master', icon: '👑', label: 'Master' },
                ];
                achList.forEach(a => {
                    const unlocked = achievements[a.key];
                    achievementsHtml += `
                        <div class="achievement-badge ${unlocked ? 'unlocked' : ''}">
                            <i class="fas ${unlocked ? 'fa-star' : 'fa-lock'}"></i>
                            ${a.icon} ${a.label}
                        </div>
                    `;
                });

                const html = `
                    <div class="result-card">
                        <div class="result-emoji">${emoji}</div>
                        <div class="result-title">${title}</div>

                        <div class="result-score-circle" style="--pct: ${pct}%">
                            <div class="score-number">${correctCount}</div>
                            <div class="score-label">dari ${total}</div>
                        </div>

                        <div class="result-details">
                            <div class="result-stat">
                                <div class="number green">${correctCount}</div>
                                <div class="label">✅ Benar</div>
                            </div>
                            <div class="result-stat">
                                <div class="number red">${wrongCount}</div>
                                <div class="label">❌ Salah/Skip</div>
                            </div>
                            <div class="result-stat">
                                <div class="number gold">${pct}%</div>
                                <div class="label">🎯 Nilai</div>
                            </div>
                        </div>

                        <div class="result-message">
                            <i class="fas fa-quote-left"></i> ${message} <i class="fas fa-quote-right"></i>
                            <br><span style="font-size:12px; color:var(--text-muted);">🔥 Streak terbaik: ${maxStreak}</span>
                        </div>

                        <div class="achievement-section">
                            ${achievementsHtml}
                        </div>

                        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:4px;">
                            <button class="btn btn-primary" id="restartBtn"><i class="fas fa-redo"></i> Main Lagi</button>
                            <button class="btn btn-secondary" id="homeBtn"><i class="fas fa-home"></i> Kategori</button>
                        </div>
                    </div>
                `;

                mainContent.innerHTML = html;
                document.getElementById('restartBtn').addEventListener('click', resetQuiz);
                document.getElementById('homeBtn').addEventListener('click', () => {
                    currentQuestions = getQuestionsByCategory(categoryFilter);
                    if (currentQuestions.length === 0) {
                        categoryFilter = 'all';
                        currentQuestions = getQuestionsByCategory('all');
                        document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                        document.querySelector('[data-category="all"]')?.classList.add('active');
                    }
                    currentIndex = 0;
                    score = 0;
                    correctCount = 0;
                    totalAnswered = 0;
                    streak = 0;
                    updateStreak();
                    renderQuestion();
                });
            }

            // ============================================================
            //  RESET
            // ============================================================
            function resetQuiz() {
                if (isGameMode) {
                    initGame();
                    return;
                }
                stopTimer();
                currentQuestions = getQuestionsByCategory(categoryFilter);
                if (currentQuestions.length === 0) {
                    categoryFilter = 'all';
                    currentQuestions = getQuestionsByCategory('all');
                    document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-category="all"]')?.classList.add('active');
                }
                currentIndex = 0;
                score = 0;
                correctCount = 0;
                totalAnswered = 0;
                streak = 0;
                updateStreak();
                renderQuestion();
                showToast('🔄 Quiz direset!', 'info');
            }

            // ============================================================
            //  CATEGORY SELECTOR
            // ============================================================
            categorySelector.addEventListener('click', function(e) {
                const btn = e.target.closest('.cat-chip');
                if (!btn) return;
                const category = btn.dataset.category;

                document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                if (category === 'game') {
                    initGame();
                    return;
                }

                isGameMode = false;
                categoryFilter = category;
                stopTimer();
                currentQuestions = getQuestionsByCategory(category);
                if (currentQuestions.length === 0) {
                    categoryFilter = 'all';
                    currentQuestions = getQuestionsByCategory('all');
                    document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-category="all"]')?.classList.add('active');
                }
                currentIndex = 0;
                score = 0;
                correctCount = 0;
                totalAnswered = 0;
                streak = 0;
                updateStreak();
                renderQuestion();
                showToast(`📚 Kategori: ${category === 'all' ? 'Semua' : category}`, 'info');
            });

            // ============================================================
            //  INIT
            // ============================================================
            currentQuestions = getQuestionsByCategory('all');
            renderQuestion();

        })();
    </script>

</body>
</html>
