<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Quiz Champion - Aplikasi Kuis Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           ROOT VARIABLES & RESET
           ============================================================ */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --gold: #ffd700;
            --gold-dark: #f7971e;
            --green: #2ecc71;
            --green-dark: #27ae60;
            --red: #e74c3c;
            --red-dark: #c0392b;
            --blue: #3498db;
            --purple: #9b59b6;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            --radius: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Background Glow Effect */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(247, 151, 30, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(155, 89, 182, 0.06) 0%, transparent 50%);
            z-index: 0;
            animation: floatBg 20s ease-in-out infinite alternate;
        }

        @keyframes floatBg {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(2%, 2%) rotate(3deg);
            }
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
        }

        /* ============================================================
           MAIN CONTAINER
           ============================================================ */
        .app-container {
            background: var(--bg-secondary);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 32px 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-dark), var(--purple), transparent);
            opacity: 0.6;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-title .icon {
            font-size: 34px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .app-title .text {
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .app-title .badge {
            font-size: 12px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }

        .header-stats {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .stat-badge:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .stat-badge i {
            color: var(--gold);
            font-size: 16px;
        }

        .stat-badge .value {
            color: #fff;
            font-weight: 800;
        }

        .stat-badge .value.gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* ============================================================
           PROGRESS
           ============================================================ */
        .progress-section {
            margin-bottom: 24px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--purple));
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            width: 12px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0.8;
            animation: glowPulse 1.5s infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* ============================================================
           CATEGORY SELECTOR - MODERN CHIPS
           ============================================================ */
        .category-section {
            margin-bottom: 22px;
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .category-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .category-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        .cat-chip {
            flex-shrink: 0;
            padding: 8px 20px;
            border: 1.5px solid var(--border-color);
            border-radius: 60px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .cat-chip:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .cat-chip.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(247, 151, 30, 0.15));
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .cat-chip i {
            font-size: 14px;
        }

        .cat-chip .count {
            font-size: 11px;
            opacity: 0.6;
            font-weight: 400;
        }

        /* ============================================================
           QUESTION CARD
           ============================================================ */
        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px 26px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
            margin-bottom: 22px;
            transition: var(--transition);
        }

        .question-card:hover {
            border-color: var(--border-hover);
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .q-number {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .q-number i {
            color: var(--gold);
        }

        .q-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 40px;
            background: rgba(255, 215, 0, 0.08);
            color: var(--gold);
            border: 1px solid rgba(255, 215, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .q-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            color: #fff;
            margin-bottom: 10px;
        }

        .q-difficulty {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .q-difficulty .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .q-difficulty .dot.easy {
            background: var(--green);
        }
        .q-difficulty .dot.medium {
            background: var(--gold);
        }
        .q-difficulty .dot.hard {
            background: var(--red);
        }

        /* ============================================================
           OPTIONS
           ============================================================ */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0 16px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Inter', sans-serif;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: var(--transition);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), transparent);
        }

        .option-btn:hover:not(.disabled-option) {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .option-btn:hover:not(.disabled-option)::before {
            opacity: 1;
        }

        .option-label {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            font-weight: 700;
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .option-btn.correct {
            border-color: var(--green);
            background: rgba(46, 204, 113, 0.08);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1), 0 8px 30px rgba(46, 204, 113, 0.1);
            animation: correctPulse 0.5s ease;
        }

        @keyframes correctPulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1);
            }
        }

        .option-btn.correct .option-label {
            background: var(--green);
            color: #fff;
        }

        .option-btn.wrong {
            border-color: var(--red);
            background: rgba(231, 76, 60, 0.08);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
            animation: wrongShake 0.5s ease;
        }

        @keyframes wrongShake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }

        .option-btn.wrong .option-label {
            background: var(--red);
            color: #fff;
        }

        .option-btn.disabled-option {
            cursor: default;
            opacity: 0.6;
        }

        .option-btn.disabled-option:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--border-color);
        }

        /* ============================================================
           FEEDBACK
           ============================================================ */
        .feedback-box {
            margin-top: 16px;
            padding: 16px 22px;
            border-radius: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            min-height: 60px;
            transition: var(--transition);
        }

        .feedback-box i {
            font-size: 22px;
            width: 32px;
            text-align: center;
        }

        .feedback-box.correct {
            border-color: var(--green);
            background: rgba(46, 204, 113, 0.06);
            color: #8fdfb0;
        }

        .feedback-box.wrong {
            border-color: var(--red);
            background: rgba(231, 76, 60, 0.06);
            color: #f5a0a0;
        }

        .feedback-box.empty {
            color: var(--text-secondary);
        }

        .feedback-box .highlight {
            color: #fff;
            font-weight: 700;
        }

        /* ============================================================
           ACTION BAR
           ============================================================ */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .action-left,
        .action-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            padding: 12px 26px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(4px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--bg-primary);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.15);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 215, 0, 0.25);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #fff;
            box-shadow: 0 8px 30px rgba(46, 204, 113, 0.15);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            color: #fff;
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.15);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn i {
            font-size: 16px;
        }

        /* ============================================================
           RESULT CARD - PREMIUM
           ============================================================ */
        .result-card {
            text-align: center;
            padding: 20px 10px 10px;
        }

        .result-emoji {
            font-size: 80px;
            margin-bottom: 6px;
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: inline-block;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.1) rotate(3deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .result-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .result-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .result-score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 12px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: conic-gradient(var(--gold) var(--pct, 0%), var(--bg-card) var(--pct, 0%));
            position: relative;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
        }

        .result-score-circle::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: var(--bg-secondary);
        }

        .result-score-circle .score-number {
            position: relative;
            z-index: 1;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }

        .result-score-circle .score-label {
            position: relative;
            z-index: 1;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .result-details {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0 24px;
            flex-wrap: wrap;
        }

        .result-stat {
            text-align: center;
            background: var(--bg-card);
            padding: 14px 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            min-width: 100px;
        }

        .result-stat .number {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
        }

        .result-stat .number.green {
            color: var(--green);
        }
        .result-stat .number.red {
            color: var(--red);
        }
        .result-stat .number.gold {
            color: var(--gold);
        }

        .result-stat .label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .result-message {
            font-size: 17px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
        }

        .result-message strong {
            color: var(--gold);
        }

        /* ============================================================
           ACHIEVEMENTS / BADGES
           ============================================================ */
        .achievement-section {
            margin: 16px 0 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .achievement-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .achievement-badge.unlocked {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 215, 0, 0.06);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
        }

        .achievement-badge i {
            font-size: 20px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 700px) {
            .app-container {
                padding: 22px 16px;
                border-radius: 20px;
            }
            .app-title {
                font-size: 22px;
            }
            .app-title .badge {
                font-size: 10px;
                padding: 2px 10px;
            }
            .q-text {
                font-size: 19px;
            }
            .option-btn {
                padding: 14px 16px;
                font-size: 14px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 13px;
            }
            .stat-badge {
                font-size: 12px;
                padding: 6px 14px;
            }
            .result-score-circle {
                width: 130px;
                height: 130px;
            }
            .result-score-circle .score-number {
                font-size: 34px;
            }
            .result-details {
                gap: 12px;
            }
            .result-stat {
                padding: 12px 16px;
                min-width: 80px;
            }
            .result-stat .number {
                font-size: 22px;
            }
            .cat-chip {
                font-size: 12px;
                padding: 6px 14px;
            }
        }

        @media (max-width: 420px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-stats {
                justify-content: space-between;
            }
            .action-bar {
                flex-direction: column;
            }
            .action-left,
            .action-right {
                width: 100%;
                justify-content: center;
            }
            .btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* ============================================================
           TOAST NOTIFICATION
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {

            };

            // DOM
            const mainContent = document.getElementById('mainContent');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const streakDisplay = document.getElementById('streakDisplay');
            const timerDisplay = document.getElementById('timerDisplay');
            const timerFill = document.getElementById('timerFill');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const progressPercent = document.getElementById('progressPercent');
            const categorySelector = document.getElementById('categorySelector');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            // ============================================================
            //  HELPERS
            // ============================================================
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function getQuestionsByCategory(category) {
                if (category === 'all') return shuffleArray([...allQuestions]);
                const filtered = allQuestions.filter(q => q.category === category);
                return shuffleArray(filtered);
            }

            function updateScore() {
                scoreDisplay.textContent = score;
            }

            function updateStreak() {
                streakDisplay.textContent = streak;
            }

            function updateProgress() {
                const total = currentQuestions.length;
                const done = Math.min(currentIndex, total);
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                progressFill.style.width = Math.min(pct, 100) + '%';
                progressText.textContent = `Soal ${done} / ${total}`;
                progressPercent.textContent = pct + '%';
            }

            function updateTimerDisplay(value) {
                timerDisplay.textContent = value;
                const pct = (value / 15) * 100;
                timerFill.style.width = pct + '%';
                timerFill.style.background =
                    value <= 5 ?
                    'linear-gradient(90deg, #e74c3c, #c0392b)' :
                    value <= 10 ?
                    'linear-gradient(90deg, #f7971e, #ffd200)' :
                    'linear-gradient(90deg, #00d2ff, #3a7bd5)';
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isTimerRunning = false;
                }
            }

            function startTimer() {
                stopTimer();
                timer = 15;
                updateTimerDisplay(timer);
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timer--;
                    updateTimerDisplay(timer);
                    if (timer <= 0) {
                        stopTimer();
                        if (!answered) autoFail();
                    }
                }, 1000);
            }

            function autoFail() {
                const options = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');
                if (!answered && options.length > 0) {
                    options.forEach(btn => {
                        btn.classList.add('disabled-option');
                        if (btn.dataset.correct === 'true') btn.classList.add('correct');
                    });
                    const q = currentQuestions[currentIndex];
                    feedback.className = 'feedback-box wrong';
                    feedback.innerHTML =
                        `<i class="fas fa-clock"></i> ⏰ Waktu habis! Jawaban: <span class="highlight">${q.options[q.answer]}</span>`;
                    answered = true;
                    totalAnswered++;
                    streak = 0;
                    updateStreak();
                    document.getElementById('nextBtn').disabled = false;
                    checkAchievements();
                }
            }

            function showToast(message, type = 'success') {
                const icons = {
                    success: 'fas fa-check-circle icon-success',
                    error: 'fas fa-times-circle icon-error',
                    info: 'fas fa-info-circle icon-info'
                };
                toast.querySelector('i').className = icons[type] || icons.info;
                toastMessage.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            function checkAchievements() {
                const total = currentQuestions.length;
                // First Blood
                if (!achievements.firstBlood && score > 0) {
                    achievements.firstBlood = true;
                    showToast('🏅 Achievement: First Blood! Dapatkan skor pertama!', 'info');
                }
                // Streak 5
                if (!achievements.streak5 && streak >= 5) {
                    achievements.streak5 = true;
                    showToast('🔥 Achievement: Streak 5! Jawab 5 benar berturut-turut!', 'info');
                }
                // Streak 10
                if (!achievements.streak10 && streak >= 10) {
                    achievements.streak10 = true;
                    showToast('⚡ Achievement: Streak 10! Luar biasa konsisten!', 'info');
                }
                // Perfect Score
                if (!achievements.perfectScore && score === total && total > 0) {
                    achievements.perfectScore = true;
                    showToast('💯 Achievement: Perfect Score! Jawab semua benar!', 'info');
                }
                // Master
                if (!achievements.master && score >= 50) {
                    achievements.master = true;
                    showToast('👑 Achievement: Master! Skor mencapai 50+!', 'info');
                }
            }

            // ============================================================
            //  RENDER QUESTION
            // ============================================================
            function renderQuestion() {
                if (currentIndex >= currentQuestions.length) {
                    renderResult();
                    return;
                }

                const q = currentQuestions[currentIndex];
                const labels = ['A', 'B', 'C', 'D'];
                const diffMap = { 'Mudah': 'easy', 'Sedang': 'medium', 'Sulit': 'hard' };

                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button class="option-btn" data-index="${idx}" data-correct="${q.answer === idx ? 'true' : 'false'}">
                            <span class="option-label">${labels[idx]}</span>
                            ${opt}
                        </button>
                    `;
                });

                const html = `
                    <div class="question-card">
                        <div class="q-meta">
                            <span class="q-number">
                                <i class="fas fa-question-circle"></i> Soal ${currentIndex + 1} / ${currentQuestions.length}
                            </span>
                            <span class="q-category"><i class="fas fa-tag"></i> ${q.category}</span>
                        </div>
                        <div class="q-text">${q.question}</div>
                        <div class="q-difficulty">
                            <span class="dot ${diffMap[q.difficulty] || 'easy'}"></span>
                            ${q.difficulty || 'Mudah'}
                        </div>
                    </div>

                    <div class="options-grid" id="optionsGrid">
                        ${optionsHtml}
                    </div>

                    <div class="feedback-box empty" id="feedback">
                        <i class="fas fa-lightbulb"></i> Pilih jawaban atau biarkan timer berjalan.
                    </div>

                    <div class="action-bar">
                        <div class="action-left">
                            <button class="btn btn-secondary" id="resetBtn"><i class="fas fa-redo"></i> Ulang</button>
                            <button class="btn btn-secondary" id="skipBtn"><i class="fas fa-forward"></i> Skip</button>
                        </div>
                        <div class="action-right">
                            <button class="btn btn-primary" id="nextBtn" disabled><i class="fas fa-arrow-right"></i> Selanjutnya</button>
                        </div>
                    </div>
                `;

                mainContent.innerHTML = html;
                answered = false;
                updateScore();
                updateProgress();
                updateStreak();

                // Events
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', onOptionClick);
                });
                document.getElementById('resetBtn').addEventListener('click', resetQuiz);
                document.getElementById('skipBtn').addEventListener('click', skipQuestion);
                document.getElementById('nextBtn').addEventListener('click', nextQuestion);

                startTimer();
            }

            // ============================================================
            //  OPTION CLICK
            // ============================================================
            function onOptionClick(e) {
                if (answered) return;
                const btn = e.currentTarget;
                const isCorrect = btn.dataset.correct === 'true';
                const allBtns = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');

                stopTimer();
                allBtns.forEach(b => b.classList.add('disabled-option'));

                if (isCorrect) {
                    btn.classList.add('correct');
                    score += 1;
                    correctCount++;
                    streak++;
                    maxStreak = Math.max(maxStreak, streak);
                    feedback.className = 'feedback-box correct';
                    feedback.innerHTML = `<i class="fas fa-check-circle"></i> ✅ Benar! +1 poin`;
                    showToast('✅ Jawaban Benar!', 'success');
                } else {
                    btn.classList.add('wrong');
                    streak = 0;
                    allBtns.forEach(b => {
                        if (b.dataset.correct === 'true') b.classList.add('correct');
                    });
                    const q = currentQuestions[currentIndex];
                    feedback.className = 'feedback-box wrong';
                    feedback.innerHTML =
                        `<i class="fas fa-times-circle"></i> ❌ Salah. Jawaban: <span class="highlight">${q.options[q.answer]}</span>`;
                    showToast('❌ Jawaban Salah', 'error');
                }

                updateScore();
                updateStreak();
                totalAnswered++;
                document.getElementById('nextBtn').disabled = false;
                answered = true;
                checkAchievements();
            }

            // ============================================================
            //  NAVIGATION
            // ============================================================
            function nextQuestion() {
                if (!answered) return;
                stopTimer();
                currentIndex++;
                renderQuestion();
            }

            function skipQuestion() {
                if (answered) return;
                stopTimer();
                const allBtns = document.querySelectorAll('.option-btn');
                const feedback = document.getElementById('feedback');
                allBtns.forEach(b => b.classList.add('disabled-option'));
                const q = currentQuestions[currentIndex];
                allBtns.forEach(b => {
                    if (b.dataset.correct === 'true') b.classList.add('correct');
                });
                feedback.className = 'feedback-box wrong';
                feedback.innerHTML =
                    `<i class="fas fa-forward"></i> ⏭️ Dilewati. Jawaban: <span class="highlight">${q.options[q.answer]}</span>`;
                answered = true;
                totalAnswered++;
                streak = 0;
                updateStreak();
                document.getElementById('nextBtn').disabled = false;
                showToast('⏭️ Soal dilewati', 'info');
            }

            // ============================================================
            //  RESULT
            // ============================================================
            function renderResult() {
                stopTimer();
                const total = currentQuestions.length;
                const wrongCount = totalAnswered - correctCount;
                const pct = total > 0 ? Math.round((correctCount / total) * 100) : 0;

                let emoji, title, message;
                if (pct === 100) { emoji = '🏆';
                    title = 'Sempurna!';
                    message = 'Kamu menjawab <strong>semua soal dengan benar</strong>! Kamu benar-benar hebat!'; } else if (
                    pct >= 80) { emoji = '🌟';
                    title = 'Luar Biasa!';
                    message = `Kamu mendapatkan <strong>${pct}%</strong> jawaban benar. Pertahankan prestasimu!`; } else if (
                    pct >= 60) { emoji = '💪';
                    title = 'Bagus!';
                    message = `Kamu menjawab <strong>${pct}%</strong> dengan benar. Terus tingkatkan!`; } else if (pct >=
                    40) { emoji = '📖';
                    title = 'Semangat!';
                    message = `Kamu mencapai <strong>${pct}%</strong>. Belajar lebih giat lagi ya!`; } else { emoji = '😅';
                    title = 'Coba Lagi!';
                    message = `Jangan menyerah! ${pct}% bukan akhir. Latihan membuat sempurna!`; }

                // Achievement badges
                let achievementsHtml = '';
                const achList = [
                    { key: 'firstBlood', icon: '🩸', label: 'First Blood' },
                    { key: 'streak5', icon: '🔥', label: 'Streak 5' },
                    { key: 'streak10', icon: '⚡', label: 'Streak 10' },
                    { key: 'perfectScore', icon: '💯', label: 'Perfect Score' },
                    { key: 'master', icon: '👑', label: 'Master' },
                ];
                achList.forEach(a => {
                    const unlocked = achievements[a.key];
                    achievementsHtml += `
                        <div class="achievement-badge ${unlocked ? 'unlocked' : ''}">
                            <i class="fas ${unlocked ? 'fa-star' : 'fa-lock'}"></i>
                            ${a.icon} ${a.label}
                        </div>
                    `;
                });

                const html = `
                    <div class="result-card">
                        <div class="result-emoji">${emoji}</div>
                        <div class="result-title">${title}</div>
                        <div class="result-subtitle">Quiz Selesai! 🎉</div>

                        <div class="result-score-circle" style="--pct: ${pct}%">
                            <div class="score-number">${correctCount}</div>
                            <div class="score-label">dari ${total}</div>
                        </div>

                        <div class="result-details">
                            <div class="result-stat">
                                <div class="number green">${correctCount}</div>
                                <div class="label">✅ Benar</div>
                            </div>
                            <div class="result-stat">
                                <div class="number red">${wrongCount}</div>
                                <div class="label">❌ Salah/Skip</div>
                            </div>
                            <div class="result-stat">
                                <div class="number gold">${pct}%</div>
                                <div class="label">🎯 Nilai</div>
                            </div>
                        </div>

                        <div class="result-message">
                            <i class="fas fa-quote-left"></i> ${message} <i class="fas fa-quote-right"></i>
                            <br><span style="font-size:13px; color:var(--text-muted);">🔥 Streak terbaik: ${maxStreak} jawaban benar berturut-turut</span>
                        </div>

                        <div class="achievement-section">
                            ${achievementsHtml}
                        </div>

                        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px;">
                            <button class="btn btn-primary" id="restartBtn"><i class="fas fa-redo"></i> Main Lagi</button>
                            <button class="btn btn-secondary" id="homeBtn"><i class="fas fa-home"></i> Kategori</button>
                        </div>
                    </div>
                `;

                mainContent.innerHTML = html;
                timerFill.style.width = '100%';
                timerDisplay.textContent = '0';

                document.getElementById('restartBtn').addEventListener('click', resetQuiz);
                document.getElementById('homeBtn').addEventListener('click', () => {
                    currentQuestions = getQuestionsByCategory(categoryFilter);
                    currentIndex = 0;
                    score = 0;
                    correctCount = 0;
                    totalAnswered = 0;
                    streak = 0;
                    renderQuestion();
                });
            }

            // ============================================================
            //  RESET
            // ============================================================
            function resetQuiz() {
                stopTimer();
                currentQuestions = getQuestionsByCategory(categoryFilter);
                currentIndex = 0;
                score = 0;
                correctCount = 0;
                totalAnswered = 0;
                streak = 0;
                updateStreak();
                renderQuestion();
                showToast('🔄 Quiz direset!', 'info');
            }

            // ============================================================
            //  CATEGORY SELECTOR
            // ============================================================
            categorySelector.addEventListener('click', function(e) {
                const btn = e.target.closest('.cat-chip');
                if (!btn) return;
                const category = btn.dataset.category;
                document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                categoryFilter = category;
                stopTimer();
                currentQuestions = getQuestionsByCategory(category);
                currentIndex = 0;
                score = 0;
                correctCount = 0;
                totalAnswered = 0;
                streak = 0;
                updateStreak();
                renderQuestion();
                showToast(`📚 Kategori: ${category === 'all' ? 'Semua' : category}`, 'info');
            });

            // ============================================================
            //  INIT
            // ============================================================
            currentQuestions = getQuestionsByCategory('all');
            renderQuestion();

        })();
    </script>

</body>
</html>
